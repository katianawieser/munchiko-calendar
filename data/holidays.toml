[[holiday]]
name = "New Year's Day"
date = "01-01"
keywords = ["new year", "sparkle", "gold", "party"]

[[holiday]]
name = "Martin Luther King Jr. Day"
nth_weekday = { n = 3, weekday = "mon", month = 1 }
keywords = ["community", "kindness"]

[[holiday]]
name = "Lunar New Year"
description = "Follows the lunar calendar, so the date is looked up each year."
by_year = { 2026 = "02-17", 2027 = "02-06", 2028 = "01-26" }
keywords = ["lunar new year", "red", "gold", "lantern"]

