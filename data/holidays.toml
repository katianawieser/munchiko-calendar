# Holidays and notable days for Mochi & Momo's calendar.
#
# Edit freely: the app reads this file every time it starts and updates the
# calendar to match. (A copy is also built into the app, used only when this
# file is missing.)
#
# Each [[holiday]] needs a `name` (it's also the holiday's identity, so renaming
# one counts as removing it and adding a new one) and exactly ONE date rule:
#
#   date          = "MM-DD"                                   same day every year
#   nth_weekday   = { n = 4, weekday = "thu", month = 11 }    4th Thursday of November
#                   (n = -1 means the last one, -2 second to last...)
#   easter_offset = -47                                       days from Easter Sunday
#   by_year       = { 2027 = "02-06" }                        dates you look up each year;
#                   years without a date are skipped
#
# Optional:
#   kind        = "holiday" (default), "notable_day", "seasonal" or "outing"
#   description = "..."
#   keywords    = ["..."]   used for bow suggestions later (M5)
#   days        = 7         length of a multi-day event (default 1)
#   offset_days = 1         shift the date the rule gives, e.g. day after Thanksgiving

# ---------------------------------------------------------------------------
# Mochi & Momo
# ---------------------------------------------------------------------------

[[holiday]]
name = "Mochi's Birthday"
kind = "notable_day"
date = "10-15"
keywords = ["mochi", "birthday", "party", "cake"]

[[holiday]]
name = "Mochi's Adoption Day"
kind = "notable_day"
date = "01-11"
keywords = ["mochi", "adoption", "gotcha day", "family"]

[[holiday]]
name = "Momo's Birthday"
kind = "notable_day"
date = "03-03"
keywords = ["momo", "birthday", "party", "cake"]

[[holiday]]
name = "Momo's Adoption Day"
kind = "notable_day"
date = "07-05"
keywords = ["momo", "adoption", "gotcha day", "family"]

