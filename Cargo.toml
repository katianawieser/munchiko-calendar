[package]
name = "munchiko-calendar"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"  # minimum for the 2024 edition
description = "Content planner for Mochi & Momo's social media account: works backward from post dates to schedule bow-making, backdrops and photo shoots."

[dependencies]
askama = "0.14.0"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
# Thumbnails and format conversion; pure Rust, nothing to install
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "json"] }
# Scratch files for HEIC conversion (see photos.rs)
tempfile = "3"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "fs", "process", "time"] }
toml = "1.1.6"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
